# ==============================================================================
# Salvus Disaster Intelligence Platform — Local Docker Compose Environment
# ==============================================================================

services:
  salvus-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: salvus-backend
    restart: unless-stopped
    ports:
      - '${PORT:-8000}:8000'
    environment:
      - ENVIRONMENT=development
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/salvus.db
      - AUTO_SEED=true
      - OSRM_BASE_URL=https://router.project-osrm.org
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - SECRET_KEY=${SECRET_KEY:-salvus_local_docker_dev_secret_key_32_chars_min}
      # Optional AI Triage Keys (Inherits from host environment or .env if present)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Mount host backend/data to container /app/data for SQLite persistence across restarts
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
