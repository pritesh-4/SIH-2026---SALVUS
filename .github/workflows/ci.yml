name: Salvus CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel obsolete in-progress runs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Strict lockfile integrity)
        run: npm ci

      - name: Check Prettier Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Production Build
        run: npm run build

  backend-quality:
    name: Backend Lint, Format & Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: ruff check backend

      - name: Check Ruff Formatting
        run: ruff format --check backend

      - name: Run Pytest Test Suite
        run: |
          cd backend
          python -m pytest -v --durations=10
