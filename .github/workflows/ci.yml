name: Salvus CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel obsolete in-progress runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (Strict lockfile integrity)
        run: npm ci

      - name: Check Prettier Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Production Build (Vite)
        run: npm run build
