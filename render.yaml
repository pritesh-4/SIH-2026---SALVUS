# ==============================================================================
# Salvus Disaster Intelligence & Rescue Coordination Platform
# Render Blueprint (Infrastructure as Code)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Salvus Backend Web Service (FastAPI + Socket.IO)
  # ----------------------------------------------------------------------------
  - type: web
    name: salvus-backend
    runtime: python
    region: oregon # Options: oregon, frankfurt, singapore, ohio, virginia
    plan: free # Free tier or starter tier
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:combined_asgi_app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGIN
        value: '*' # Set to your frontend domain in production (e.g., https://salvus.vercel.app or https://salvus-frontend.onrender.com)
      - key: DATABASE_PATH
        value: data/salvus.db
      - key: AUTO_SEED
        value: 'true'
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      # Optional AI / LLM API Keys for AI Triage Service
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Salvus Frontend Static Site (React + Vite SPA) [Optional Full-Stack]
  # ----------------------------------------------------------------------------
  - type: web
    name: salvus-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: salvus-backend
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: salvus-backend
          property: host
